name: CI BiblioTech

on:
  push:
    branches: [ main, develop, "feature/**", "practica/**" ]
  pull_request:
    branches: [ develop, main ]

jobs:
  pruebas:
    name: Pruebas JUnit
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ejecutar pruebas
        run: mvn -B test

  empaquetado:
    name: Compilar y empaquetar
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generar el JAR
        run: mvn -B -DskipTests package
